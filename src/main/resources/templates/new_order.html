<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>New Order - Chabhuja Flour Mill</title>

    <!-- Bootstrap Offline CSS -->
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/Order.css}">
</head>


<body>

<div class="container" style="height:500px">

    <div class="order-container">

        <div class="order-card">

            <div class="order-header">
                <h2>🌾 Chabhuja Flour Mill</h2>
                <p>New Order Creation</p>
            </div>


            <div class="order-body">

                <form th:action="@{/Order/save}"
                      th:object="${order}"
                      method="post">


                    <div class="row">

                        <div class="col-md-3">
                            <label class="form-label">
                                Customer Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Customer name"
                                   th:field="*{ordername}">
                        </div>


                        <div class="col-md-3">

                            <label class="form-label">
                                Flour Quantity (KG)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   placeholder="Quantity"
                                   th:field="*{orderqt}">

                        </div>


                        <div class="col-md-3">

                            <label class="form-label">
                                Flour Type
                            </label>

                            <select class="form-select">
                                <option>Wheat Flour</option>
                                <option>Maida</option>
                                <option>Sooji</option>
                            </select>

                        </div>


                        <div class="col-md-3">

                            <label class="form-label">
                                Delivery Date
                            </label>

                            <input type="date"
                                   class="form-control">

                        </div>

                    </div>


                    <div class="mt-4 text-center">

                        <button type="submit"
                                class="btn save-btn px-5">
                            💾 Save Order
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>


</div>


<!-- Bootstrap Offline JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
