<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Customer</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header text-center bg-primary text-white">
                    <h4>Add Customer</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/customers/save}" th:object="${customer}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{name}" placeholder="Enter name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text" class="form-control"
                                   th:field="*{mobile}" placeholder="Enter mobile number" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control"
                                      th:field="*{address}" rows="3"
                                      placeholder="Enter address"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Save Customer
                            </button>
                        </div>

                    </form>
                </div>

                <div class="card-footer text-center">
                    <a th:href="@{/customers/list}" class="btn btn-outline-primary btn-sm">
                        View Customers
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
